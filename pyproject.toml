[project]
name = "mojo-blosc2"
version = "0.1.0"
description = "Blosc2 blocked byte-shuffle and LZ4 compression implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["numpy", "pytest", "blosc2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
